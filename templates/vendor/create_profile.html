{% extends "base.html" %}
{% block title %}Create Vendor Profile{% endblock %}

{% block content %}

<style>
  .vp-wrap{max-width:900px;margin:28px auto;}
  .vp-card{
    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05);
    border-radius:18px;
    box-shadow:0 18px 55px rgba(0,0,0,.22);
    overflow:hidden;
  }
  .vp-head{
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,.12);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;
  }
  .vp-title{margin:0;font-size:24px}
  .vp-sub{margin:6px 0 0;opacity:.75;font-size:13px;line-height:1.35}

  .vp-body{padding:18px;}
  .vp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .vp-field{display:grid;gap:8px;}
  .vp-field.full{grid-column:1/-1;}
  label{font-size:13px;font-weight:800;opacity:.9;}
  input, textarea{
    width:100%;
    padding:11px 12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.16);
    color: inherit;
    outline:none;
  }
  input:focus, textarea:focus{border-color: rgba(79,140,255,.7); background: rgba(0,0,0,.22);}
  textarea{min-height:110px;resize:vertical;}

  .vp-actions{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;
    border-top:1px solid rgba(255,255,255,.12);
    padding:14px 18px;
  }
  .vp-btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:12px;
    font-weight:900;
    text-decoration:none;
    border:1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06);
    color: inherit;
    cursor:pointer;
  }
  .vp-btn.primary{
    border-color: transparent;
    background: linear-gradient(135deg, rgba(79,140,255,1), rgba(47,111,255,1));
    color:#fff;
  }
  .vp-hint{margin-right:auto;opacity:.72;font-size:12px;}

  @media(max-width:720px){
    .vp-grid{grid-template-columns:1fr;}
    .vp-btn{width:100%;}
    .vp-hint{width:100%;}
  }
</style>

<div class="vp-wrap">

  <div class="vp-card">

    <div class="vp-head">
      <div>
        <h2 class="vp-title">Create Vendor Profile</h2>
        <p class="vp-sub">
          Create your vendor profile once. Then you can add products from Vendor Dashboard.
        </p>
      </div>
    </div>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="vp-body">
        <div class="vp-grid">

          <div class="vp-field full">
            <label for="id_name">Shop / Vendor Name</label>
            <input id="id_name" type="text" name="name" placeholder="e.g. Masuma Store" required>
          </div>

          <div class="vp-field">
            <label for="id_phone">Phone</label>
            <input id="id_phone" type="text" name="phone" placeholder="+8801XXXXXXXXX" required>
          </div>

          <div class="vp-field">
            <label for="id_zip">ZIP</label>
            <input id="id_zip" type="text" name="zip" placeholder="e.g. 1207" required>
          </div>

          <div class="vp-field full">
            <label for="id_address">Address</label>
            <textarea id="id_address" name="address" placeholder="Full address..." required></textarea>
          </div>

          <div class="vp-field">
            <label for="id_city">City</label>
            <input id="id_city" type="text" name="city" placeholder="Dhaka" required>
          </div>

          <div class="vp-field">
            <label for="id_state">State</label>
            <input id="id_state" type="text" name="state" placeholder="Dhaka Division" required>
          </div>

          <div class="vp-field">
            <label for="id_country">Country</label>
            <input id="id_country" type="text" name="country" placeholder="Bangladesh" required>
          </div>

          <div class="vp-field">
            <label for="id_logo">Logo (Required)</label>
            <input id="id_logo" type="file" name="logo" accept="image/*" required>
          </div>

          <div class="vp-field full">
            <label for="id_description">Description</label>
            <textarea id="id_description" name="description" placeholder="About your shop..." required></textarea>
          </div>

        </div>
      </div>

      <div class="vp-actions">
        <div class="vp-hint">All fields are required (logo required by your model).</div>
        <a class="vp-btn" href="{% url 'dashboard' %}">Cancel</a>
        <button class="vp-btn primary" type="submit">Create Profile</button>
      </div>
    </form>

  </div>

</div>

{% endblock %}
